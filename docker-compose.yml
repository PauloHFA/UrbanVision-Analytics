services:
  db:
    image: postgis/postgis:16-3.4
    container_name: urbanvision_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbanvision
      POSTGRES_PASSWORD: urbanvision_secret
      POSTGRES_DB: urbanvision_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanvision -d urbanvision_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urbanvision_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://urbanvision:urbanvision_secret@db:5432/urbanvision_db
      PROJECT_NAME: "UrbanVision Analytics"
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/crops:/app/data/crops
      - ./data/reports:/app/data/reports

volumes:
  pgdata:
    driver: local
